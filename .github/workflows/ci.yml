# Staged CI caller — org-standard replacement for .github/workflows/build.yml.
# Promoted by a maintainer via tabnas/admin rollout/apply-ci-folders.sh
# (session credentials cannot write .github/workflows/*; admin DECISIONS.md ADR-8).
name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  ci:
    uses: tabnas/.github/.github/workflows/polyglot-ci.yml@main
    with:
      # debug is cloned because go/clib imports jsonic, which needs debug/go,
      # and json/go/debugtest (in the go workspace) replaces debug/go with the
      # sibling checkout: without the clone the workspace names a missing dir.
      deps: "parser support debug json"
      build-order: "parser support debug json path"
